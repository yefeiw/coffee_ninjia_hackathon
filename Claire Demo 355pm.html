<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Ninja ☕</title>
  <style>
    :root {
      --espresso:      #1C0A00;
      --coffee-dark:   #5C3317;
      --coffee:        #7B4A2D;
      --latte:         #C68642;
      --latte-light:   #E8A96B;
      --cream:         #FFF8F1;
      --foam:          #FEF0E2;
      --foam-border:   #EDD5B8;
      --white:         #FFFFFF;
      --text-primary:  #1C0A00;
      --text-secondary:#6B4530;
      --text-muted:    #9B7B66;
      --success:       #1F6E3F;
      --success-bg:    #EBF5EE;
      --success-border:#A8D5B8;
      --peer:          #1D4ED8;
      --peer-bg:       #EEF4FF;
      --peer-border:   #BFDBFE;
      --border:        #E8D4C0;
      --shadow:        0 2px 16px rgba(92,51,23,0.08);
      --shadow-hover:  0 8px 32px rgba(92,51,23,0.16);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--cream);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .screen { animation: screenIn .35s cubic-bezier(.4,0,.2,1); }
    @keyframes screenIn {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ════════════════════════════════════════════════════
       WELCOME
    ════════════════════════════════════════════════════ */
    .welcome {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:100vh; padding:48px 24px;
      text-align:center;
      background: radial-gradient(ellipse 80% 60% at 60% -10%, rgba(198,134,66,.18) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 50% at -10% 80%, rgba(92,51,23,.08) 0%, transparent 70%),
                  var(--cream);
    }
    .logo { display:flex; align-items:center; gap:9px; margin-bottom:44px; font-size:20px; font-weight:800; color:var(--coffee-dark); letter-spacing:-.4px; }
    .logo-cup { font-size:26px; }
    .welcome-badge { display:inline-flex; align-items:center; gap:6px; background:var(--white); border:1px solid var(--foam-border); border-radius:100px; padding:5px 14px; font-size:12px; font-weight:600; color:var(--coffee); margin-bottom:22px; box-shadow:0 1px 4px rgba(92,51,23,.06); letter-spacing:.2px; }
    .welcome-title { font-size:clamp(34px,6vw,56px); font-weight:900; color:var(--espresso); line-height:1.1; letter-spacing:-2px; margin-bottom:18px; max-width:580px; }
    .welcome-title em { font-style:normal; background:linear-gradient(135deg,#C68642,#5C3317); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .welcome-sub { font-size:17px; color:var(--text-secondary); max-width:460px; margin-bottom:36px; line-height:1.7; }
    .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--coffee-dark) 0%,#A05A30 100%); color:white; border:none; border-radius:14px; padding:16px 36px; font-size:16px; font-weight:700; cursor:pointer; transition:all .2s; box-shadow:0 4px 20px rgba(92,51,23,.32); letter-spacing:-.3px; }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(92,51,23,.42); }
    .social-proof { display:flex; align-items:center; gap:10px; margin-top:36px; font-size:13px; color:var(--text-muted); }
    .avatars { display:flex; }
    .mini-av { width:28px; height:28px; border-radius:50%; border:2.5px solid var(--cream); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:white; margin-left:-8px; }
    .mini-av:first-child { margin-left:0; }
    .welcome-stats { display:flex; gap:36px; margin-top:44px; padding-top:32px; border-top:1px solid var(--foam-border); }
    .stat { text-align:center; }
    .stat-n { font-size:26px; font-weight:900; color:var(--coffee-dark); letter-spacing:-1px; }
    .stat-l { font-size:12px; color:var(--text-muted); margin-top:2px; }

    /* ════════════════════════════════════════════════════
       ONBOARDING
    ════════════════════════════════════════════════════ */
    .onboarding { max-width:540px; margin:0 auto; padding:28px 22px 80px; }
    .ob-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .ob-logo { font-size:15px; font-weight:800; color:var(--coffee-dark); display:flex; align-items:center; gap:7px; }
    .ob-step-count { font-size:13px; color:var(--text-muted); font-weight:500; }
    .progress-track { height:3px; background:var(--foam-border); border-radius:2px; margin-bottom:36px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--coffee-dark),var(--latte)); border-radius:2px; transition:width .45s cubic-bezier(.4,0,.2,1); }
    .step-pill { display:inline-flex; align-items:center; gap:5px; background:var(--foam); border:1px solid var(--foam-border); border-radius:100px; padding:4px 12px; font-size:11px; font-weight:700; color:var(--coffee); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }
    .step-title { font-size:clamp(22px,4.5vw,30px); font-weight:900; color:var(--espresso); letter-spacing:-1px; margin-bottom:6px; line-height:1.2; }
    .step-sub { font-size:14px; color:var(--text-secondary); margin-bottom:26px; line-height:1.6; }
    .field-group { margin-bottom:18px; }
    .field-label { display:block; font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
    .field-input, .field-textarea { width:100%; padding:13px 15px; border:1.5px solid var(--border); border-radius:12px; font-size:15px; color:var(--text-primary); background:var(--white); font-family:inherit; outline:none; transition:all .18s; }
    .field-input:focus, .field-textarea:focus { border-color:var(--latte); box-shadow:0 0 0 3px rgba(198,134,66,.14); }
    .field-input::placeholder, .field-textarea::placeholder { color:var(--text-muted); }
    .field-textarea { resize:none; min-height:86px; }
    .role-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:4px; }
    .role-tile { padding:13px 14px; border:1.5px solid var(--border); border-radius:13px; cursor:pointer; background:var(--white); transition:all .18s; text-align:left; }
    .role-tile:hover:not(.sel) { border-color:var(--latte); background:var(--foam); }
    .role-tile.sel { border-color:var(--coffee-dark); background:var(--foam); }
    .tile-em { font-size:20px; display:block; margin-bottom:5px; }
    .tile-label { font-size:13px; font-weight:700; color:var(--text-primary); display:block; }
    .tile-sub { font-size:11px; color:var(--text-muted); display:block; margin-top:2px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border:1.5px solid var(--border); border-radius:100px; font-size:13px; font-weight:500; cursor:pointer; background:var(--white); color:var(--text-secondary); transition:all .18s; user-select:none; }
    .chip:hover:not(.sel) { border-color:var(--latte); color:var(--coffee); }
    .chip.sel { background:var(--coffee-dark); border-color:var(--coffee-dark); color:white; }
    .chips-hint { font-size:12px; color:var(--text-muted); }
    .exp-row { display:flex; gap:8px; margin-bottom:4px; }
    .exp-tile { flex:1; padding:11px 6px; border:1.5px solid var(--border); border-radius:11px; text-align:center; cursor:pointer; background:var(--white); transition:all .18s; }
    .exp-tile:hover:not(.sel) { border-color:var(--latte); }
    .exp-tile.sel { border-color:var(--coffee-dark); background:var(--foam); }
    .exp-n { font-size:15px; font-weight:800; color:var(--espresso); display:block; }
    .exp-l { font-size:10px; color:var(--text-muted); display:block; margin-top:2px; }
    .step-nav { display:flex; justify-content:space-between; align-items:center; margin-top:28px; }
    .btn-back { padding:12px 20px; border:1.5px solid var(--border); border-radius:11px; font-size:14px; font-weight:600; color:var(--text-muted); background:var(--white); cursor:pointer; transition:all .18s; }
    .btn-back:hover { border-color:var(--coffee); color:var(--coffee); }
    .btn-next { display:inline-flex; align-items:center; gap:7px; padding:13px 28px; background:linear-gradient(135deg,var(--coffee-dark),#A05A30); border:none; border-radius:11px; font-size:14px; font-weight:700; color:white; cursor:pointer; transition:all .2s; }
    .btn-next:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(92,51,23,.3); }
    .btn-next:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ════════════════════════════════════════════════════
       MATCHING
    ════════════════════════════════════════════════════ */
    .matching { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:40px 24px; text-align:center; background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(198,134,66,.14) 0%,transparent 65%),var(--cream); }
    .brew-wrap { position:relative; margin-bottom:32px; }
    .brew-ring { width:90px; height:90px; border-radius:50%; border:3px solid var(--foam-border); border-top-color:var(--coffee); animation:spin 1s linear infinite; }
    .brew-cup { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:34px; animation:floatBrew 2s ease-in-out infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes floatBrew { 0%,100% { transform:translate(-50%,-50%) scale(1); } 50% { transform:translate(-50%,-52%) scale(1.08); } }
    .matching-title { font-size:24px; font-weight:800; color:var(--espresso); letter-spacing:-.6px; margin-bottom:24px; }
    .matching-steps { list-style:none; }
    .matching-steps li { font-size:14px; color:var(--text-muted); padding:5px 0; transition:all .3s; }
    .matching-steps li.active { color:var(--coffee); font-weight:700; }
    .matching-steps li.done  { color:var(--success); }

    /* ════════════════════════════════════════════════════
       MATCHES
    ════════════════════════════════════════════════════ */
    .matches-wrap { max-width:640px; margin:0 auto; padding:28px 18px 64px; }
    .matches-logo { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:800; color:var(--coffee-dark); margin-bottom:22px; }
    .found-pill { display:inline-flex; align-items:center; gap:7px; background:var(--success-bg); border:1px solid var(--success-border); border-radius:100px; padding:5px 14px; font-size:12px; font-weight:700; color:var(--success); margin-bottom:11px; }
    .matches-title { font-size:clamp(22px,4.5vw,30px); font-weight:900; color:var(--espresso); letter-spacing:-1px; margin-bottom:5px; line-height:1.2; }
    .matches-sub { font-size:14px; color:var(--text-secondary); margin-bottom:22px; }
    .your-profile { display:flex; gap:13px; align-items:flex-start; background:var(--foam); border:1px solid var(--foam-border); border-radius:14px; padding:15px 16px; margin-bottom:22px; }
    .you-av { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--coffee-dark),var(--coffee)); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:white; flex-shrink:0; }
    .you-name { font-size:14px; font-weight:700; color:var(--espresso); }
    .you-role { font-size:12px; color:var(--text-muted); margin-top:2px; }
    .you-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .you-tag { font-size:11px; font-weight:500; background:var(--white); border:1px solid var(--border); border-radius:100px; padding:2px 9px; color:var(--text-secondary); }

    /* ── MATCH CARD ─────────────────────────────── */
    .match-card { background:var(--white); border:1px solid var(--border); border-radius:20px; margin-bottom:18px; overflow:hidden; box-shadow:var(--shadow); transition:box-shadow .2s; }
    .match-card:hover { box-shadow:var(--shadow-hover); }
    .card-head { display:flex; gap:13px; align-items:flex-start; padding:18px 18px 15px; border-bottom:1px solid var(--foam-border); }
    .match-av { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:white; flex-shrink:0; }
    .card-meta { flex:1; min-width:0; }
    .card-name { font-size:16px; font-weight:800; color:var(--espresso); letter-spacing:-.3px; }
    .card-headline { font-size:13px; color:var(--text-secondary); margin-top:2px; }
    .card-co { font-weight:700; color:var(--coffee); }
    .card-bg { font-size:12px; color:var(--text-muted); margin-top:3px; line-height:1.4; }
    .card-score { font-size:12px; color:var(--latte); font-weight:700; margin-top:5px; }
    .type-badge { flex-shrink:0; font-size:10px; font-weight:800; padding:4px 10px; border-radius:100px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
    .badge-mutual { background:#FFF3E0; color:#BF4D00; border:1px solid #FFD09E; }
    .badge-give   { background:var(--success-bg); color:var(--success); border:1px solid var(--success-border); }
    .badge-peer   { background:var(--peer-bg); color:var(--peer); border:1px solid var(--peer-border); }
    .card-section { padding:16px 18px; border-bottom:1px solid var(--foam-border); }
    .section-lbl { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:12px; }
    .exchange { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ex-cell { border-radius:12px; padding:12px 13px; background:var(--foam); }
    .ex-cell.you  { border-left:3px solid var(--latte-light); }
    .ex-cell.them { border-left:3px solid var(--coffee-dark); }
    .ex-dir { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .ex-dir.you  { color:#A06020; }
    .ex-dir.them { color:var(--coffee-dark); }
    .ex-text { font-size:13px; color:var(--text-primary); line-height:1.45; }
    .why-box { margin-top:11px; padding:12px 13px; background:#FFFAF2; border-radius:11px; border-left:3px solid var(--latte); }
    .why-text { font-size:13px; color:var(--text-secondary); line-height:1.6; }
    .prompt-list { display:flex; flex-direction:column; gap:9px; }
    .prompt-item { display:flex; gap:10px; align-items:flex-start; background:var(--foam); border-radius:12px; padding:12px 13px; }
    .prompt-ico { font-size:15px; flex-shrink:0; margin-top:1px; }
    .prompt-txt { font-size:13px; color:var(--text-secondary); line-height:1.55; font-style:italic; }
    .card-action { padding:15px 18px; }
    .btn-interested { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; background:linear-gradient(135deg,var(--coffee-dark) 0%,#A05A30 100%); border:none; border-radius:13px; font-size:15px; font-weight:700; color:white; cursor:pointer; transition:all .2s; letter-spacing:-.2px; font-family:inherit; }
    .btn-interested:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(92,51,23,.32); }

    /* ── CARD CHAT STATES ─────────────────────── */
    .card-chat-active { display:flex; gap:10px; align-items:center; background:var(--foam); border:1px solid var(--foam-border); border-radius:13px; padding:13px 15px; }
    .card-chat-confirmed { display:flex; gap:10px; align-items:center; background:var(--success-bg); border:1px solid var(--success-border); border-radius:13px; padding:13px 15px; }
    .cca-dot { width:9px; height:9px; border-radius:50%; background:#22C55E; flex-shrink:0; animation:pulseGreen 2s ease-in-out infinite; }
    @keyframes pulseGreen { 0%,100% { opacity:.7; transform:scale(1); } 50% { opacity:1; transform:scale(1.25); } }
    .cca-info { flex:1; min-width:0; }
    .cca-title { font-size:13px; font-weight:700; color:var(--espresso); }
    .cca-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
    .ccf-check { font-size:18px; color:var(--success); flex-shrink:0; }
    .ccf-title { font-size:13px; font-weight:700; color:var(--success); }
    .ccf-detail { font-size:12px; color:#3D6B50; margin-top:2px; }
    .btn-open-chat { flex-shrink:0; padding:8px 14px; border:1.5px solid var(--border); border-radius:9px; font-size:12px; font-weight:700; cursor:pointer; background:white; color:var(--coffee-dark); transition:all .18s; font-family:inherit; }
    .btn-open-chat:hover { background:var(--foam); border-color:var(--coffee); }

    /* Footer stats */
    .match-footer { display:flex; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-top:24px; }
    .mf-stat { flex:1; text-align:center; padding:16px 8px; background:var(--foam); }
    .mf-n { font-size:22px; font-weight:900; color:var(--espresso); letter-spacing:-.5px; }
    .mf-l { font-size:11px; color:var(--text-muted); margin-top:2px; line-height:1.3; }

    /* ════════════════════════════════════════════════════
       CHAT OVERLAY
    ════════════════════════════════════════════════════ */
    .chat-overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column;
      background:var(--cream);
    }
    .chat-overlay.slide-in  { animation:chatSlideIn  .32s cubic-bezier(.4,0,.2,1) both; }
    .chat-overlay.slide-out { animation:chatSlideOut .26s cubic-bezier(.4,0,.2,1) both; }
    @keyframes chatSlideIn  { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes chatSlideOut { from { transform:translateY(0);    opacity:1; } to { transform:translateY(100%); opacity:0; } }

    /* Header */
    .chat-hdr {
      display:flex; align-items:center; gap:11px;
      padding:13px 16px; border-bottom:1px solid var(--foam-border);
      background:var(--white); flex-shrink:0;
    }
    .chat-back { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--border); background:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text-secondary); flex-shrink:0; transition:all .18s; }
    .chat-back:hover { background:var(--foam); border-color:var(--coffee); }
    .chat-hdr-av { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:white; flex-shrink:0; }
    .chat-hdr-info { flex:1; min-width:0; }
    .chat-hdr-name { font-size:15px; font-weight:800; color:var(--espresso); }
    .chat-hdr-sub { font-size:12px; color:var(--text-muted); margin-top:1px; }
    .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#22C55E; margin-right:5px; vertical-align:middle; }

    /* Context banner */
    .chat-ctx {
      background:var(--foam); border-bottom:1px solid var(--foam-border);
      padding:7px 16px; font-size:12px; color:var(--text-muted);
      text-align:center; flex-shrink:0;
    }
    .chat-ctx strong { color:var(--coffee-dark); }

    /* Phase status bar */
    .chat-phase-bar {
      display:flex; align-items:center; gap:0;
      padding:0 16px; background:var(--white);
      border-bottom:1px solid var(--foam-border);
      overflow-x:auto; flex-shrink:0;
      scrollbar-width:none;
    }
    .chat-phase-bar::-webkit-scrollbar { display:none; }
    .phase-step {
      display:flex; align-items:center; gap:0;
      font-size:10px; font-weight:600; color:var(--text-muted);
      padding:8px 0; white-space:nowrap;
      flex-shrink:0;
    }
    .phase-step.done  { color:var(--success); }
    .phase-step.active { color:var(--coffee-dark); font-weight:800; }
    .phase-arrow { margin:0 6px; font-size:10px; color:var(--foam-border); }

    /* Body */
    .chat-body {
      flex:1; overflow-y:auto;
      padding:18px 16px;
      display:flex; flex-direction:column; gap:10px;
      scroll-behavior:smooth;
    }

    /* Message rows */
    .msg-row { display:flex; gap:8px; align-items:flex-end; animation:msgIn .22s ease; }
    .msg-row.me  { flex-direction:row-reverse; }
    .msg-row.sys { justify-content:center; }
    @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* Mini avatar */
    .msg-av { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:white; }

    /* Bubbles */
    .bubble { max-width:78%; padding:10px 14px; font-size:14px; line-height:1.55; border-radius:18px; }
    .bubble-me   { background:var(--coffee-dark); color:white; border-bottom-right-radius:5px; }
    .bubble-them { background:var(--white); color:var(--text-primary); border:1px solid var(--border); border-bottom-left-radius:5px; }
    .bubble-sys  { background:var(--foam); color:var(--text-muted); font-size:12px; border-radius:8px; padding:7px 12px; text-align:center; max-width:90%; }
    .bts { font-size:10px; opacity:.55; display:block; margin-top:4px; }
    .bubble-me   .bts { color:rgba(255,255,255,.65); text-align:right; }
    .bubble-them .bts { color:var(--text-muted); }

    /* Typing */
    .typing-ind { display:flex; gap:8px; align-items:flex-end; animation:msgIn .22s ease; }

/* helper: get the next phase key given current chat state */
function nextPhaseKey(mid) {
  const cs   = S.chats[mid];
  const scr  = SCRIPTS[mid];
  const ph   = cs.phase;
  // Special branching after mode selection
  if (ph === 'mode_prompt') {
    return cs.mode === 'inperson'
      ? (scr.phases['mode_prompt_inperson'] ? 'mode_prompt_inperson' : 'mode_prompt')
      : (scr.phases['mode_prompt_online']   ? 'mode_prompt_online'   : 'mode_prompt');
  }
  const cur = scr.phases[ph];
  return cur ? cur.next : null;
}

  return `

  <h2 class="step-title">What can you genuinely offer?</h2>
  <p class="step-sub">Good matches are two-way. What do you bring to the table — even mid-transition?</p>
  <div class="chips">${OFFERS.map(o=>`<div class="chip ${S.form.offers.includes(o.id)?'sel':''}" data-to="${o.id}">${o.em} ${o.label}</div>`).join('')}</div>
  <p class="chips-hint">Select 1–3 genuine strengths</p>
  <div class="step-nav"><button class="btn-back" data-a="back">← Back</button><button class="btn-next" data-a="next" ${S.form.offers.length?'':'disabled'}>Continue →</button></div>`;
}

function step3() {
  const exps=['0–2','2–4','4–7','7–10','10+'];
  return `
  <div class="step-pill">⚡ Quick context</div>
  <h2 class="step-title">Almost there.</h2>
  <p class="step-sub">Two quick questions so matches understand your actual situation.</p>
  <div class="field-group">
    <label class="field-label">Years of total experience</label>
    <div class="exp-row">${exps.map(e=>`<div class="exp-tile ${S.form.exp===e?'sel':''}" data-exp="${e}"><span class="exp-n">${e}</span><span class="exp-l">yrs</span></div>`).join('')}</div>
  </div>
  <div class="field-group">
    <label class="field-label">One thing you're proud of <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <textarea class="field-textarea" data-field="proud" placeholder="e.g. Led a $2B cost-reduction programme. Launched a side project with 5K users. Doesn't have to be impressive — just real.">${esc(S.form.proud)}</textarea>
  </div>
  <div class="step-nav"><button class="btn-back" data-a="back">← Back</button><button class="btn-next" data-a="go-match">☕ Find my matches →</button></div>`;
}

/* ── MATCHING ──────────────────────────────────── */
function renderMatching() {
  return `
  <div class="screen matching">
    <div class="brew-wrap"><div class="brew-ring"></div><div class="brew-cup">☕</div></div>
    <h2 class="matching-title">Brewing your matches…</h2>
    <ul class="matching-steps">
      <li id="ms1" class="active">Analysing your needs &amp; offers</li>
      <li id="ms2">Scanning 2,400+ profiles</li>
      <li id="ms3">Scoring mutual value exchange</li>
      <li id="ms4">Crafting conversation starters</li>
    </ul>
  </div>`;
}

/* ── MATCHES ───────────────────────────────────── */
function renderMatches() {
  const nm   = S.form.name || 'You';
  const init = nm.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'YO';
  const role = S.form.role || 'Career explorer';
  const nlbl = S.form.needs.map(id=>NEEDS.find(o=>o.id===id)?.label).filter(Boolean);
  const olbl = S.form.offers.map(id=>OFFERS.find(o=>o.id===id)?.label).filter(Boolean);
  return `
  <div class="screen matches-wrap">
    <div class="matches-logo">☕ Coffee Ninja</div>
    <div class="found-pill">✓ 3 matches found for you</div>
    <h1 class="matches-title">We found people who make sense</h1>
    <p class="matches-sub">Each match is scored on genuine mutual value — not just who might be nice to know.</p>
    <div class="your-profile">
      <div class="you-av">${init}</div>
      <div>
        <div class="you-name">${esc(nm)}</div>
        <div class="you-role">${esc(role)}</div>
        <div class="you-tags">${nlbl.map(l=>`<span class="you-tag">Needs: ${l}</span>`).join('')}${olbl.map(l=>`<span class="you-tag">Offers: ${l}</span>`).join('')}</div>
      </div>
    </div>
    ${MATCHES.map(m=>card(m,nm)).join('')}
    <div class="match-footer">
      <div class="mf-stat"><div class="mf-n">94%</div><div class="mf-l">matches respond</div></div>
      <div class="mf-stat"><div class="mf-n">31 m</div><div class="mf-l">avg conversation</div></div>
      <div class="mf-stat"><div class="mf-n">2.4×</div><div class="mf-l">better than cold outreach</div></div>
    </div>
  </div>`;
}

function card(m, userName) {
  const cs = S.chats[m.id];
  const isInt = !!S.interested[m.id];
  const bc  = {mutual:'badge-mutual',give:'badge-give',peer:'badge-peer'}[m.type];
  const stars = m.score>=95?'★★★':m.score>=88?'★★☆':'★☆☆';

  let actionHtml;
  if (!isInt) {
    actionHtml = `<button class="btn-interested" data-a="interested" data-mid="${m.id}">☕ I'm Interested</button>`;
  } else if (cs && cs.confirmed) {
    const mode = cs.mode==='online'?`📹 ${cs.venue||'Online'}`:`📍 ${cs.venue||'In person'}`;
    actionHtml = `
    <div class="card-chat-confirmed">
      <div class="ccf-check">✓</div>
      <div class="cca-info">
        <div class="ccf-title">Meeting confirmed with ${m.name}</div>
        <div class="ccf-detail">${cs.time||'Time TBC'} · ${mode}</div>
      </div>
      <button class="btn-open-chat" data-a="open-chat" data-mid="${m.id}">View →</button>
    </div>`;
  } else {
    actionHtml = `
    <div class="card-chat-active">
      <div class="cca-dot"></div>
      <div class="cca-info">
        <div class="cca-title">Chat with ${m.name} started</div>
        <div class="cca-sub">Intro sent · tap to continue</div>
      </div>
      <button class="btn-open-chat" data-a="open-chat" data-mid="${m.id}">Continue →</button>
    </div>`;
  }

  return `
  <div class="match-card" id="card-${m.id}">
    <div class="card-head">
      <div class="match-av" style="background:${m.avColor}">${m.av}</div>
      <div class="card-meta">
        <div class="card-name">${m.name}</div>
        <div class="card-headline">${m.headline} · <span class="card-co">${m.company}</span></div>
        <div class="card-bg">${m.bg} · ${m.location}</div>
        <div class="card-score">${stars} ${m.score}% match</div>
      </div>
      <span class="type-badge ${bc}">${m.typeLbl}</span>
    </div>
    <div class="card-section">
      <div class="section-lbl">Why this match</div>
      <div class="exchange">
        <div class="ex-cell you"><div class="ex-dir you">YOUR GOAL</div><div class="ex-text">${m.youWant}</div></div>
        <div class="ex-cell them"><div class="ex-dir them">THEIR JOURNEY</div><div class="ex-text">${m.theyDid}</div></div>
        <div class="ex-cell them"><div class="ex-dir them">THEIR NEED</div><div class="ex-text">${m.theyWant}</div></div>
        <div class="ex-cell you"><div class="ex-dir you">YOUR STRENGTH</div><div class="ex-text">${m.youHave}</div></div>
      </div>
      <div class="why-box"><div class="why-text">💡 ${m.why}</div></div>
    </div>
    <div class="card-section">
      <div class="section-lbl">Start the conversation with</div>
      <div class="prompt-list">${m.prompts.map(p=>`<div class="prompt-item"><span class="prompt-ico">${p.em}</span><span class="prompt-txt">${p.txt}</span></div>`).join('')}</div>
    </div>
    <div class="card-action">${actionHtml}</div>
  </div>`;
}

/* ════════════════════════════════════════════════════
   CHAT ENGINE
════════════════════════════════════════════════════ */
const PHASES_LABELS = [
  {key:'warm_intro_sent',  label:'Intro sent'},
  {key:'reply_received',   label:'Reply'},
  {key:'mode_prompt',      label:'Format'},
  {key:'venue_prompt',     label:'Venue'},
  {key:'time_prompt',      label:'Time'},
  {key:'confirmed',        label:'Confirmed'},
];

function initChat(mid) {
  if (!S.chats[mid]) {
    S.chats[mid] = { phase:'idle', msgs:[], mode:null, venue:null, avail:null, time:null, confirmed:false };
  }
}

function openChat(mid) {
  initChat(mid);
  S.chatOpen = mid;
  const match = MATCHES.find(m=>m.id===mid);
  const scr   = SCRIPTS[mid];
  const cs    = S.chats[mid];
  const nm    = S.form.name || 'You';

  // Build overlay
  const overlay = document.createElement('div');
  overlay.id = 'chat-overlay';
  overlay.className = 'chat-overlay slide-in';
  overlay.innerHTML = chatHTML(match, cs);
  document.getElementById('app').appendChild(overlay);

  // Wire close
  document.getElementById('chat-back').addEventListener('click', closeChat);

  // Wire input/send
  wireInput(mid, scr);

  // Render existing messages
  cs.msgs.forEach(msg => renderBubble(mid, msg));

  // Start flow if fresh
  if (cs.phase === 'idle') {
    cs.phase = 'warm_intro_sent';
    updatePhaseBar(cs.phase);
    const introText = scr.intro(nm);
    setTimeout(() => {
      pushMsg(mid, 'me', introText);
      triggerMatchReply(mid, 'warm_intro_sent');
    }, 350);
  } else {
    scrollBody();
    updatePhaseBar(cs.phase);
    // Re-show QRs for current phase if not confirmed
    if (!cs.confirmed) {
      const curPhase = SCRIPTS[mid].phases[cs.phase];
      if (curPhase && curPhase.qrs) setQRs(mid, curPhase.qrs, SCRIPTS[mid]);
    }
  }
}

function chatHTML(match, cs) {
  const bc = {mutual:'badge-mutual',give:'badge-give',peer:'badge-peer'}[match.type];
  const typeLbl = {mutual:'Mutual Exchange',give:'Give-First',peer:'Peer Match'}[match.type];
  return `
  <div class="chat-hdr">
    <button id="chat-back" class="chat-back">←</button>
    <div class="chat-hdr-av" style="background:${match.avColor}">${match.av}</div>
    <div class="chat-hdr-info">
      <div class="chat-hdr-name">${match.name}</div>
      <div class="chat-hdr-sub"><span class="status-dot"></span>${match.headline} · ${match.company}</div>
    </div>
    <span class="type-badge ${bc}" style="font-size:9px">${typeLbl}</span>
  </div>
  <div id="chat-phase-bar" class="chat-phase-bar">
    ${PHASES_LABELS.map((p,i)=>`<div class="phase-step" data-phase="${p.key}">${p.label}</div>${i<PHASES_LABELS.length-1?'<span class="phase-arrow">›</span>':''}`).join('')}
  </div>
  <div id="chat-body" class="chat-body"></div>
  <div id="chat-ftr" class="chat-ftr">
    <div id="chat-qrs" class="qr-strip"></div>
    <div class="input-row">
      <input id="chat-input" class="chat-input" placeholder="Type a message…" type="text" autocomplete="off">
      <button id="chat-send" class="send-btn">↑</button>
    </div>
  </div>`;
}

function updatePhaseBar(phase) {
  const bar = document.getElementById('chat-phase-bar');
  if (!bar) return;
  const order = PHASES_LABELS.map(p=>p.key);
  const cur   = order.indexOf(phase);
  bar.querySelectorAll('.phase-step').forEach((el,i) => {
    el.classList.remove('done','active');
    if (i < cur)  el.classList.add('done');
    if (i === cur || (phase==='confirmed' && i===order.length-1)) el.classList.add('active');
  });
}

function pushMsg(mid, from, text) {
  const ts = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const msg = { from, text, ts };
  S.chats[mid].msgs.push(msg);
  renderBubble(mid, msg);
}

function renderBubble(mid, msg) {
  const body = document.getElementById('chat-body');
  if (!body) return;
  const match = MATCHES.find(m=>m.id===mid);
  const row = document.createElement('div');
  row.className = `msg-row ${msg.from}`;
  if (msg.from==='me') {
    row.innerHTML = `<div class="bubble bubble-me">${esc(msg.text)}<span class="bts">${msg.ts}</span></div>`;
  } else if (msg.from==='them') {
    row.innerHTML = `<div class="msg-av" style="background:${match.avColor}">${match.av}</div><div class="bubble bubble-them">${esc(msg.text)}<span class="bts">${msg.ts}</span></div>`;
  } else {
    row.innerHTML = `<div class="bubble bubble-sys">${msg.text}</div>`;
    row.classList.add('sys');
  }
  body.appendChild(row);
  scrollBody();
}

function scrollBody() {
  const b = document.getElementById('chat-body');
  if (b) b.scrollTop = b.scrollHeight;
}

function showTyping(mid) {
  const body = document.getElementById('chat-body');
  if (!body || document.getElementById('typing-ind')) return;
  const match = MATCHES.find(m=>m.id===mid);
  const div = document.createElement('div');
  div.id = 'typing-ind';
  div.className = 'typing-ind';
  div.innerHTML = `<div class="msg-av" style="background:${match.avColor}">${match.av}</div><div class="typing-bubble"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>`;
  body.appendChild(div);
  scrollBody();
}

function hideTyping() {
  const el = document.getElementById('typing-ind');
  if (el) el.remove();
}

function setQRs(mid, qrs, scr) {
  const strip = document.getElementById('chat-qrs');
  if (!strip) return;
  if (!qrs || !qrs.length) { strip.innerHTML=''; return; }
  strip.innerHTML = qrs.map(q=>`<button class="qr-btn" data-qrid="${q.id}">${q.label}</button>`).join('');
  strip.querySelectorAll('.qr-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qr = qrs.find(q=>q.id===btn.dataset.qrid);
      if (qr) handleQR(mid, qr, scr);
    });
  });
  scrollBody();
}

function handleQR(mid, qr, scr) {
  const cs = S.chats[mid];
  setQRs(mid, [], scr); // clear immediately

  // Send user message
  pushMsg(mid, 'me', qr.msg);

  // Apply state changes
  if (qr.set) Object.assign(cs, qr.set);

  // Advance phase
  advancePhase(mid, scr);
}

function advancePhase(mid, scr) {
  const cs  = S.chats[mid];
  const key = nextPhaseKey(mid);
  if (!key) return;

  const phaseDef = scr.phases[key];
  if (!phaseDef) return;

  // Show typing
  setTimeout(() => {
    showTyping(mid);
    const delay = phaseDef.delay || 1400;
    setTimeout(() => {
      hideTyping();
      const text = typeof phaseDef.text === 'function' ? phaseDef.text(cs) : phaseDef.text;
      pushMsg(mid, 'them', text);
      cs.phase = key;
      updatePhaseBar(cs.phase);

      if (phaseDef.next === 'confirmed') {
        cs.phase = 'confirmed';
        updatePhaseBar('confirmed');
        cs.confirmed = true;
        setTimeout(() => renderConfirmedCard(mid), 500);
        setQRs(mid, [], scr);
        // Disable input
        const inp = document.getElementById('chat-input');
        const snd = document.getElementById('chat-send');
        if (inp) { inp.disabled=true; inp.placeholder='Chat confirmed ✓'; }
        if (snd) snd.disabled = true;
      } else {
        setQRs(mid, phaseDef.qrs||[], scr);
      }
    }, delay);
  }, 500);
}

function triggerMatchReply(mid, phaseKey) {
  const cs  = S.chats[mid];
  const scr = SCRIPTS[mid];
  const ph  = scr.phases[phaseKey];
  if (!ph) return;

  setTimeout(() => {
    showTyping(mid);
    setTimeout(() => {
      hideTyping();
      const text = typeof ph.text==='function' ? ph.text(cs) : ph.text;
      pushMsg(mid, 'them', text);
      cs.phase = ph.next;
      updatePhaseBar(cs.phase);
      setQRs(mid, ph.qrs||[], scr);
    }, ph.delay||2000);
  }, 600);
}

function renderConfirmedCard(mid) {
  const body = document.getElementById('chat-body');
  if (!body) return;
  const cs    = S.chats[mid];
  const match = MATCHES.find(m=>m.id===mid);
  const isOnl = cs.mode==='online';

  const card = document.createElement('div');
  card.className = 'conf-card';
  card.innerHTML = `
    <div class="conf-badge2">✓ Confirmed</div>
    <div class="conf-title2">Your coffee chat is set ☕</div>
    <div class="conf-rows">
      <div class="conf-row2">👤 <span>With <strong>${match.name}</strong>, ${match.headline} at ${match.company}</span></div>
      <div class="conf-row2">📅 <span><strong>${cs.time||'Time TBC'}</strong></span></div>
      ${isOnl
        ? `<div class="conf-row2">📹 <span><strong>${cs.venue||'Google Meet'}</strong> — link will be sent before the call</span></div>`
        : `<div class="conf-row2">📍 <span><strong>${cs.venue||'Location TBC'}</strong></span></div>`}
      <div class="conf-row2">⏱️ <span>30 minutes</span></div>
    </div>
    <div class="conf-prep2">💡 Come with one specific question. The best conversations start focused and go wherever they need to.</div>
    <div class="conf-actions">
      <button class="conf-btn conf-btn-primary" onclick="closeChat()">← Back to matches</button>
    </div>`;
  body.appendChild(card);
  scrollBody();
}

function wireInput(mid, scr) {
  const input = document.getElementById('chat-input');
  const send  = document.getElementById('chat-send');
  if (!input||!send) return;

  const doSend = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    pushMsg(mid, 'me', text);
    setQRs(mid, [], scr);

    const cs = S.chats[mid];
    // Advance if we're waiting for user input
    const phaseDef = SCRIPTS[mid].phases[cs.phase];
    if (phaseDef && phaseDef.qrs && phaseDef.qrs.length > 0) {
      advancePhase(mid, scr);
    }
  };
  send.addEventListener('click', doSend);
  input.addEventListener('keydown', e => { if(e.key==='Enter') doSend(); });
}

function closeChat() {
  const overlay = document.getElementById('chat-overlay');
  if (!overlay) return;
  overlay.classList.remove('slide-in');
  overlay.classList.add('slide-out');
  setTimeout(() => {
    overlay.remove();
    const mid = S.chatOpen;
    S.chatOpen = null;
    if (mid) refreshCard(mid);
  }, 260);
}

function refreshCard(mid) {
  const match = MATCHES.find(m=>m.id===mid);
  const old   = document.getElementById(`card-${mid}`);
  if (!old||!match) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = card(match, S.form.name||'You');
  const newCard = tmp.firstElementChild;
  old.replaceWith(newCard);
  // re-wire open-chat button
  newCard.querySelectorAll('[data-a="open-chat"]').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.mid));
  });
}

/* ════════════════════════════════════════════════════
   EVENT WIRING
════════════════════════════════════════════════════ */
function wire() {
  on('[data-a="start"]',    () => { S.screen='onboarding'; S.step=0; render(); });
  on('[data-a="next"]',     () => { S.step++; render(); });
  on('[data-a="back"]',     () => { S.step>0?S.step--:(S.screen='welcome'); render(); });
  on('[data-a="go-match"]', startMatching);

  qsa('[data-field]').forEach(el => {
    el.addEventListener('input', e => {
      S.form[e.target.dataset.field] = e.target.value;
      const btn = q('[data-a="next"]');
      if (btn && S.step===0) btn.disabled = !(S.form.name.trim()||S.form.role.trim());
    });
  });

  qsa('[data-rq]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.rq;
      S.form.roleQuick = S.form.roleQuick===id?'':id;
      if (!S.form.role) {
        const map={consultant:'Strategy Consultant',pm:'Product Manager',engineer:'Software Engineer',student:'MBA Student'};
        S.form.role = map[id]||'';
      }
      render();
    });
  });

  qsa('[data-tn]').forEach(el => el.addEventListener('click', ()=>toggle(S.form.needs, el.dataset.tn, 3)));
  qsa('[data-to]').forEach(el => el.addEventListener('click', ()=>toggle(S.form.offers, el.dataset.to, 3)));
  qsa('[data-exp]').forEach(el => el.addEventListener('click', ()=>{ S.form.exp=el.dataset.exp; render(); }));

  // Interested → open chat
  qsa('[data-a="interested"]').forEach(el => {
    el.addEventListener('click', () => {
      const mid = el.dataset.mid;
      S.interested[mid] = true;
      initChat(mid);
      refreshCard(mid); // update card first
      openChat(mid);
    });
  });

  // Open existing chat
  qsa('[data-a="open-chat"]').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.mid));
  });
}

/* ── MATCHING ANIMATION ──────────────────────── */
function startMatching() {
  S.screen='matching'; render();
  const ids=['ms1','ms2','ms3','ms4'];
  let i=0;
  const tick = setInterval(()=>{
    const cur=document.getElementById(ids[i]);
    if(cur){cur.classList.remove('active');cur.classList.add('done');cur.textContent='✓ '+cur.textContent;}
    i++;
    if(i<ids.length){const nxt=document.getElementById(ids[i]);if(nxt)nxt.classList.add('active');}
    else{clearInterval(tick);setTimeout(()=>{S.screen='matches';render();},700);}
  },720);
}

/* ── HELPERS ─────────────────────────────────── */
const q   = s=>document.querySelector(s);
const qsa = s=>document.querySelectorAll(s);
const on  = (sel,fn)=>{const el=q(sel);if(el)el.addEventListener('click',fn);};

function toggle(arr,id,max) {
  const i=arr.indexOf(id);
  i>=0?arr.splice(i,1):(arr.length<max&&arr.push(id));
  render();
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── BOOT ────────────────────────────────────── */
render();
</script>

</html>
